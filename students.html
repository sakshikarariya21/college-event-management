<!DOCTYPE html>
<html>
<head>
<title>Registered Students</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<header>
    <h1 class="heading">
        Shri Krishan Institute of Engineering and Technology
    </h1>

    <nav>

        <div class="logo">
            <img src="skietlogo.jpg" alt="logo">
        </div>

        <div class="menu">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
            <a href="students.html">Students</a>
        </div>

        <div class="social-icons">
            <a href="https://wa.me/918059400807" class="whatsapp" target="_blank">
                <i class="fa-brands fa-whatsapp"></i>
            </a>

            <a href="https://skiet.org/" class="facebook" target="_blank">
                <i class="fa-brands fa-facebook"></i>
            </a>
        </div>

         <div class="button">
            <a href="https://skiet.org/" target="_blank" class="btn">Call Us</a>
         </div>

    </nav>

</header>

<section class="students-page">

<h2>Registered Students</h2>

<table id="studentTable">

<thead>

<tr>
<th>Name</th>
<th>Roll No</th>
<th>Course</th>
<th>Year</th>
<th>Semester</th>
<th>Email</th>
<th>Event</th>
</tr>

</thead>

<tbody>

</tbody>

</table>

</section>

<script>

let registrations =
JSON.parse(localStorage.getItem("registrations")) || [];

let tableBody =
document.querySelector("#studentTable tbody");

registrations.forEach(student => {

let row = `
<tr>
<td>${student.name}</td>
<td>${student.roll}</td>
<td>${student.course}</td>
<td>${student.year}</td>
<td>${student.semester}</td>
<td>${student.email}</td>
<td>${student.event}</td>
</tr>
`;

tableBody.innerHTML += row;

});

</script>
<div class="clear-section">

    <button id="clearBtn">Clear All Records</button>

    <div id="confirmModal" class="confirm-modal">

        <div class="confirm-content">

            <h3>Delete Records</h3>

            <p>Are you sure you want to delete all registered students?</p>

            <button id="confirmYes">Yes, Delete</button>

            <button id="confirmNo">Cancel</button>

        </div>

    </div>

</div>
<script src="script.js"></script>
<script>

const clearBtn = document.getElementById("clearBtn");
const modal = document.getElementById("confirmModal");
const yesBtn = document.getElementById("confirmYes");
const noBtn = document.getElementById("confirmNo");

clearBtn.onclick = function(){
    modal.style.display = "block";
};

noBtn.onclick = function(){
    modal.style.display = "none";
};

yesBtn.onclick = function(){

    localStorage.removeItem("registrations");

    document.querySelector("#studentTable tbody").innerHTML = "";

    modal.style.display = "none";

};

</script>
</body>
</html>
